apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: foodflow
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: foodflow/payment-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8003
        env:
        - name: SERVICE_NAME
          value: "payment_service"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8003"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: foodflow-secrets
              key: PAYMENT_DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: foodflow-secrets
              key: PAYMENT_DB_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.foodflow.svc.cluster.local:5432/payment_service_db"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: foodflow-config
              key: LOG_LEVEL
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: foodflow
  labels:
    app: payment-service
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
  selector:
    app: payment-service
