apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: foodflow
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: foodflow/order-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: SERVICE_NAME
          value: "order_service"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8001"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: foodflow-secrets
              key: ORDER_DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: foodflow-secrets
              key: ORDER_DB_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.foodflow.svc.cluster.local:5432/order_service_db"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: foodflow-config
              key: LOG_LEVEL
        - name: RESTAURANT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: foodflow-config
              key: RESTAURANT_SERVICE_URL
        - name: PAYMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: foodflow-config
              key: PAYMENT_SERVICE_URL
        - name: DELIVERY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: foodflow-config
              key: DELIVERY_SERVICE_URL
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: foodflow-config
              key: NOTIFICATION_SERVICE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: foodflow
  labels:
    app: order-service
spec:
  type: NodePort
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30001
    name: http
  selector:
    app: order-service
